apiVersion: apps/v1
kind: Deployment
metadata:
  name: nptelboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nptelboard
  template:
    metadata:
      labels:
        app: nptelboard
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/REPOSITORY:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nptelboard-secrets
                  key: database-url
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nptelboard-secrets
                  key: admin-password
            - name: RATE_LIMIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nptelboard-secrets
                  key: rate-limit-secret
          readinessProbe:
            httpGet:
              path: /api/courses
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/courses
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nptelboard
spec:
  type: NodePort
  selector:
    app: nptelboard
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
